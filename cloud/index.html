<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#183D30">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EasyGart">
<meta name="color-scheme" content="light">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="description" content="EasyGart Cloud: gestione del verde, squadra e incarichi.">
<title>EasyGart Cloud | Team</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--green:#1d4232;--dark:#123528;--leaf:#d8edb4;--canvas:#f6f8f3;--white:#fff;--line:#dce6da;--muted:#65776b;--red:#a33e3d;--amber:#936019;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--dark);font:15px/1.52 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
h1,h2,h3,p{margin:0}h1{font-size:clamp(27px,5vw,39px);letter-spacing:-1.3px}h2{font-size:21px;letter-spacing:-.5px}h3{font-size:15px}p{line-height:1.6}a{color:inherit}
.top{background:var(--green);color:#fff;padding:16px max(20px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.brand{font-size:23px;font-weight:850;letter-spacing:-1px}.brand span{color:var(--leaf)}
.top-sub{font-size:12px;opacity:.84}.container{max-width:1160px;margin:0 auto;padding:26px 18px 88px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:22px;flex-wrap:wrap}
.view-head p,.muted{color:var(--muted)}.eyebrow{letter-spacing:.17em;font-size:11px;font-weight:800;text-transform:uppercase;color:#66866e}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 8px 28px #15382609}
.card h2{margin-bottom:8px}.card p+p{margin-top:9px}.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.stacked{display:flex;flex-direction:column;gap:14px}.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
button.primary,button.secondary,button.ghost{border-radius:11px;border:1px solid transparent;padding:11px 17px;font-weight:700;min-height:42px}
button.primary{background:var(--green);color:#fff}button.secondary{background:var(--leaf);color:var(--dark)}button.ghost{background:#fff;border-color:var(--line);color:var(--dark)}
button.small{padding:7px 11px;font-size:12px;min-height:34px}
button.primary:focus-visible,button.secondary:focus-visible,button.ghost:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8cbf7f;outline-offset:2px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:650}
input,select,textarea{border:1px solid #cbd8cb;background:#fff;border-radius:10px;color:var(--dark);padding:12px;min-height:43px;width:100%;max-width:100%;font-size:15px}
textarea{resize:vertical;min-height:90px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.span2{grid-column:1/-1}
.alert{border-radius:12px;background:#eaf2e1;padding:13px 16px;border:1px solid #d3e5c8;font-size:13px}
.alert.warn{background:#fff3e1;border-color:#ecd9b5;color:#614923}
.alert.error{background:#fff0ed;border-color:#e8c7bc;color:#802b27}
.pill{display:inline-block;border-radius:100px;background:#e8efe6;color:#395940;padding:4px 10px;font-weight:750;font-size:11px;white-space:nowrap}
.pill.amber{background:#fff0d5;color:#81550d}.pill.red{background:#fce7e7;color:#943333}
.taskrow{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:17px 0;border-bottom:1px solid var(--line)}
.taskrow:last-child{border-bottom:0;padding-bottom:0}.taskrow:first-child{padding-top:0}
.task-title{font-weight:760;font-size:16px}.task-meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:8px}
.task-note{color:#4a6154;font-size:13px;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}.task-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:19px}
.nav button{border-radius:9px;padding:10px 14px;background:transparent;border:1px solid transparent;font-weight:750;color:#4b6455}
.nav button.active{background:var(--green);color:white}
.auth-wrap{max-width:475px;margin:45px auto}.auth-wrap h1{font-size:29px;margin:5px 0 10px}.auth-wrap .card{padding:28px}.switch{display:flex;gap:8px;margin-bottom:16px}
.switch button{flex:1}
.metric strong{font-size:32px;line-height:1.2;display:block;margin-top:9px}.metric span{font-size:13px;color:var(--muted)}
.hidden{display:none!important}.footer{font-size:12px;color:var(--muted);margin-top:28px;padding-top:15px;border-top:1px solid var(--line)}
#notice{margin-bottom:18px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media(max-width:760px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.span2{grid-column:1}.container{padding:20px 14px 90px}.card{padding:17px}.view-head{align-items:flex-start}.taskrow{flex-direction:column;gap:11px}.task-right{align-items:flex-start}.top{padding:15px 18px}.auth-wrap{margin:20px auto}.auth-wrap .card{padding:22px}}
/* On narrow screens, long German labels stay inside accessible two-column navigation. */
@media(max-width:760px){
  .top{flex-direction:column;align-items:stretch;gap:12px;padding:15px 16px}
  #top-right{display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:9px;width:100%}
  #top-right span{font-size:11px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
  #top-right select{min-width:0;max-width:100%;width:100%!important}
  #top-right .ghost{padding:9px 10px;min-height:40px;white-space:nowrap}
  .nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:26px;align-items:stretch}
  .nav button{background:#fff;border:1px solid var(--line);min-width:0;width:100%;
    min-height:52px;padding:10px 8px;text-align:center;line-height:1.3;
    font-size:13px;overflow-wrap:anywhere;white-space:normal;hyphens:auto}
  .nav button.active{background:var(--green);color:#fff;border-color:var(--green)}
  .view-head{gap:11px}
  .view-head h1{font-size:clamp(28px,9vw,36px);overflow-wrap:anywhere}
  .card,.taskrow{min-width:0}
  .task-title,.task-note,.card p{overflow-wrap:anywhere}
  .toolbar>*{max-width:100%}
  .cardhead{flex-wrap:wrap}
}
@media(max-width:380px){
  #top-right{grid-template-columns:66px minmax(0,1fr) auto;gap:6px}
  #top-right .ghost{font-size:12px;padding:8px}
  .nav button{font-size:12px;padding:9px 6px}
}

/* Reports: photo proof and client signature, optimized for touch screens */
.eg-media-section{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.eg-media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}
.eg-photo-tile{background:#f7faf4;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;gap:5px;min-width:0}
.eg-photo-tile img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#f0f2ed}
.eg-photo-tile .ghost{font-size:11px;min-height:30px;padding:6px;border-radius:0;line-height:1.3;white-space:normal}
.eg-photo-tile a:focus-visible{outline:3px solid #8cbf7f;outline-offset:-3px}
.eg-upload{background:#f7faf4;border:1px dashed #92ad97;border-radius:12px;padding:11px;margin-top:12px}
.eg-upload input{max-width:100%;border:0;background:none;padding:6px 0}
.eg-signature-preview{max-width:380px;margin-top:9px}
.eg-signature-preview .eg-photo-tile img{aspect-ratio:3.5/1;object-fit:contain;background:white}
.eg-signature-form{padding:14px;border-radius:14px;background:#f7faf4;border:1px solid var(--line);margin-top:12px}
.eg-signature-form canvas{display:block;width:100%;height:auto;max-height:270px;touch-action:none;background:white;border:1px solid #9cac9d;border-radius:12px;cursor:crosshair}
.eg-check{display:flex;align-items:flex-start;gap:11px;font-size:13px;line-height:1.5}
.eg-check input{width:20px;height:20px;min-height:20px;flex:none;margin:0}
@media(max-width:760px){
.eg-media-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.eg-photo-tile .ghost{font-size:10px}
.eg-signature-form{padding:10px}
.eg-upload input{font-size:12px}
}

/* Business features and mobile installability */
.eg-business-usage{border-top:1px solid var(--line);padding-top:14px;margin-top:16px;min-width:0}
.eg-business-usage .taskrow{padding:9px 0}
.eg-business-inline{background:#f6faf6;border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:12px}
.eg-business-form{margin-top:14px}
.eg-business-form .field{min-width:0}
.eg-invoice-total{text-align:right;margin:15px 0}
.eg-invoice-total p{margin:5px 0}
.eg-invoice-detail{scroll-margin-top:20px}
#eg-network-banner{background:#74430d;color:white;padding:11px 16px;text-align:center;font-size:13px;font-weight:650;
 position:sticky;top:0;z-index:30;box-shadow:0 2px 6px #0002}
#eg-network-banner[hidden]{display:none}
#eg-print-zone{display:none}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
 outline:3px solid #86bc77;outline-offset:2px
}
@media(max-width:760px){
 input,select,textarea{font-size:16px}
 .eg-business-inline{padding:10px}
 .eg-invoice-detail{overflow-wrap:anywhere}
 .view-head>.actions{width:100%;flex-wrap:wrap}
 .view-head>.actions button{flex:1;min-width:130px}
 .eg-invoice-total{text-align:left}
}
@media print{
 @page{size:A4;margin:17mm}
 body{background:#fff;color:#111;font:11pt/1.4 Arial,sans-serif}
 body>header,body>main,body>footer,body>#eg-network-banner{display:none!important}
 #eg-print-zone{display:block!important;position:static!important;background:#fff;color:#111}
 #eg-print-zone .eg-print-sheet{padding:0;max-width:none}
 #eg-print-zone table{width:100%;border-collapse:collapse;margin:24px 0}
 #eg-print-zone th,#eg-print-zone td{border-bottom:1px solid #777;padding:9px 7px;text-align:left}
 #eg-print-zone th{font-weight:700}
 #eg-print-zone h1{font-size:24pt}
 #eg-print-zone .eg-invoice-total{text-align:right}
}
</style>
</head>
<body>
<header class="top"><div><div class="brand">easygart<span>.</span></div><div class="top-sub">Team Cloud • account e incarichi</div></div><div id="top-right" class="actions"></div></header>
<main class="container" id="app"><div class="card">Caricamento EasyGart Cloud…</div></main>
<div id="eg-print-zone" aria-hidden="true"></div>
<footer class="container footer">EasyGart Cloud MVP · La demo storica resta disponibile sulla pagina principale · Non inserire dati reali prima della verifica dei permessi.</footer>
<script src="./config.js"></script>
<script src="./operations.js?v=20261115-ops-v1"></script>
<script src="./business.js?v=20261116-business-v1"></script>
<script src="./mobile.js?v=20261116-mobile-v1"></script>
<script type="module" src="./app.js?v=20261116-business-v1"></script>
</body>
</html>
