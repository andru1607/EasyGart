name: EasyGart iOS and Android browser smoke
on:
  push:
    paths:
      - 'cloud/**'
      - 'tests/mobile-browser.mjs'
      - '.github/workflows/mobile-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and WebKit browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Test mobile app without real customer data
        run: node tests/mobile-browser.mjs
