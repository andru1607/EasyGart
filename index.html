function seed(){const today=localDate(),yesterday=localDate(new Date(Date.now()-86400000));return {version:1,company:{name:'EasyGart (dimostrazione)',vat:'',fiscalCode:'',street:'',zip:'',city:'',province:'',email:'',phone:'',pec:'',sdi:'',iban:'',taxRegime:'RF01',notes:''},clients:[{id:'cl1',type:'azienda',name:'Condominio Le Querce',vat:'',fiscalCode:'',street:'Via dei Tigli 12',zip:'',city:'',province:'',email:'',phone:'',pec:'',sdi:'',notes:'Esempio dimostrativo'},{id:'cl2',type:'privato',name:'Villa Fontana',vat:'',fiscalCode:'',street:'Via del Parco 8',zip:'',city:'',province:'',email:'',phone:'',pec:'',sdi:'',notes:'Esempio dimostrativo'}],sites:[{id:'si1',clientId:'cl1',name:'Giardino condominiale',address:'Via dei Tigli 12'},{id:'si2',clientId:'cl2',name:'Giardino privato',address:'Via del Parco 8'}],staff:[{id:'st1',name:'Responsabile demo',role:'titolare',active:true},{id:'st2',name:'Luca Bianchi',role:'operatore',active:true},{id:'st3',name:'Sara Verdi',role:'operatore',active:true}],attendance:[],tasks:[{id:'ta1',title:'Potatura siepi perimetrali',clientId:'cl1',siteId:'si1',staffId:'st2',date:today,priority:'alta',done:false,note:''},{id:'ta2',title:'Controllo irrigazione',clientId:'cl2',siteId:'si2',staffId:'st3',date:today,priority:'media',done:false,note:''},{id:'ta3',title:'Raccolta foglie e pulizia vialetto',clientId:'cl1',siteId:'si1',staffId:'st1',date:yesterday,priority:'bassa',done:true,note:''}],products:[{id:'pr1',name:'Terriccio universale',unit:'sacco',price:8.5,priceMode:'net',vat:22},{id:'pr2',name:'Concime granulare',unit:'kg',price:5.9,priceMode:'net',vat:22},{id:'pr3',name:'Pacciamatura',unit:'m²',price:11.5,priceMode:'gross',vat:22}],reports:[],reportMaterials:[],invoices:[]};}
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch{data=seed()};
for(const k of Object.keys(seed()))if(data[k]===undefined)data[k]=seed()[k];
let screen='dashboard',modal=null, mobileMenu=false, search='',filter='all',currentStaffId=data.staff[0]?.id||'',toastTimer=null,recognition=null;

function field(label,n,kind='text',val='',opts=''){return `<label class="field"><span>${esc(label)}</span><input class="input" type="${kind}" name="${n}" value="${esc(val)}" ${opts}></label>`}

function filtered(items,fn){return items.filter(fn)}
function priceParts(item){const rate=fnum(item.vat)/100,qty=fnum(item.qty),price=fnum(item.price);const net=round(qty*(item.priceMode==='gross'?price/(1+rate):price));const vat=round(net*rate);return {net,vat,gross:round(net+vat)}}
function invoiceTotal(lines){return lines.reduce((s,l)=>{const p=priceParts(l);s.net+=p.net;s.vat+=p.vat;s.gross+=p.gross;return s},{net:0,vat:0,gross:0})}
function activeAttendance(staffId){return data.attendance.find(a=>a.staffId===staffId&&!a.end)}

function pageHeader(title,subtitle,action='',eyebrow='Il tuo spazio di lavoro'){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="head-actions">${action}</div></div>`}

function render(){const app=document.getElementById('app');app.innerHTML=`<div class="layout">${navigation()}<main class="app-main"><header class="topbar"><div class="topbar-left"><span class="breadcrumb">Workspace</span><span class="breadcrumb desktop"> / </span><strong>${esc(NAV.find(x=>x[0]===screen)?.[1]||'Panoramica')}</strong></div><div class="topbar-right"><span class="tagline">Ambiente dimostrativo</span><select class="role-select" aria-label="Operatore in simulazione" id="current-staff">${data.staff.filter(s=>s.active).map(s=>`<option value="${esc(s.id)}" ${currentStaffId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><div class="avatar">${esc(name('staff',currentStaffId).slice(0,1).toUpperCase())}</div></div></header><section class="page">${view()}</section></main>${mobileNavigation()}</div>${modal?renderModal():''}`;document.title='EasyGart | '+(NAV.find(x=>x[0]===screen)?.[1]||'Gestionale')}
function view(){switch(screen){case 'dashboard':return dashboard();case 'reports':return reports();case 'tasks':return tasks();case 'attendance':return attendance();case 'materials':return materials();case 'invoices':return invoices();case 'clients':return clients();case 'settings':return settings();default:return dashboard()}}
function stat(label,value,foot,ico){return `<div class="card stat"><span class="stat-label">${label}</span><div class="metric-icon">${icon(ico)}</div><div class="stat-value monotext">${value}</div><div class="stat-foot">${foot}</div></div>`}
function dashboard(){let today=localDate();const todays=data.tasks.filter(t=>t.date===today),active=data.attendance.filter(a=>!a.end);const pending=data.reportMaterials.filter(m=>m.billable&&!m.invoiceId&&byId('reports',m.reportId)?.status==='approved');const pendingVal=sum(pending,m=>priceParts(m).gross);const recent=[...data.reports].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
return `${pageHeader('Buona giornata.','Il lavoro sul campo e l’ufficio, finalmente nello stesso posto.',`${btn(`${icon('plus')} Nuovo rapporto`,'open:report','primary')}`,new Intl.DateTimeFormat(window.__easygartLocale==='de'?'de-DE':'it-IT',{weekday:'long'}).format(new Date())+' • '+(window.__easygartLocale==='de'?'Tagesplanung':'Pianificazione quotidiana'))}
<div class="stat-grid">${stat('Attività di oggi',todays.filter(t=>!t.done).length,`${todays.filter(t=>t.done).length} completate oggi`,'checklist')}${stat('Personale in turno',active.length,`${data.staff.filter(s=>s.active).length} membri registrati`,'users')}${stat('Rapporti',data.reports.length,`${data.reports.filter(r=>r.status==='draft').length} in attesa di verifica`,'book')}${stat('Da fatturare',euro(pendingVal),`${pending.length} voci approvate`,'receipt')}</div>
<div class="feature-row"><div class="card"><div class="card-head"><div><h2>Le attività di oggi</h2><p class="subtitle">Priorità e interventi programmati</p></div>${btn('Tutte le attività '+icon('arrow',14),'navigate','secondary','data-id="tasks"')}</div>${todays.length?todays.map(t=>`<div class="list-row"><button class="toggle ${t.done?'done':''}" aria-label="Completa attività" data-action="toggle-task" data-id="${t.id}">${t.done?icon('check',13):''}</button><div class="grow"><h3 class="${t.done?'done-text':''}">${esc(t.title)}</h3><p>${esc(name('clients',t.clientId))} · ${esc(name('staff',t.staffId))}</p></div>${badge(t.priority==='alta'?'red':t.priority==='media'?'amber':'grey',t.priority)}</div>`).join(''):empty('checklist','Nessun intervento per oggi','Aggiungi un’attività per iniziare.')}</div>

function tasks(){let items=[...data.tasks].sort((a,b)=>a.done-b.done||a.date.localeCompare(b.date));if(filter==='open')items=items.filter(t=>!t.done);if(filter==='done')items=items.filter(t=>t.done);if(search)items=items.filter(t=>(t.title+' '+name('clients',t.clientId)).toLowerCase().includes(search.toLowerCase()));return `${pageHeader('Attività e scadenze','Ogni incarico è assegnato, tracciato e spuntabile.',btn(`${icon('plus')} Nuova attività`,'open:task','primary'))}<div class="card card-pad" style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><strong>Avanzamento complessivo</strong><strong>${taskCompletion()}%</strong></div><div class="kpi-progress"><div class="progress"><i style="width:${taskCompletion()}%"></i></div></div><div class="small muted" style="margin-top:9px">${data.tasks.filter(t=>t.done).length} attività completate su ${data.tasks.length}</div></div><div class="filters"><input class="input" id="search" placeholder="Cerca per attività o cliente..." value="${esc(search)}"><select class="select" id="task-filter"><option value="all" ${filter==='all'?'selected':''}>Tutte</option><option value="open" ${filter==='open'?'selected':''}>Da fare</option><option value="done" ${filter==='done'?'selected':''}>Completate</option></select></div><div class="card">${items.length?items.map(t=>`<div class="list-row"><button class="toggle ${t.done?'done':''}" data-action="toggle-task" data-id="${t.id}" aria-label="${t.done?'Riapri':'Completa'} attività">${t.done?icon('check',13):''}</button><div class="grow"><h3 class="${t.done?'done-text':''}">${esc(t.title)}</h3><div class="job-meta" style="margin-top:7px"><span>${icon('calendar')}${fmtDate(t.date)}</span><span>${icon('building')}${esc(name('clients',t.clientId))}</span><span>${icon('users')}${esc(name('staff',t.staffId))}</span></div></div>${badge(t.priority==='alta'?'red':t.priority==='media'?'amber':'grey',t.priority)}<button class="icon-button" data-action="open:task" data-id="${t.id}" title="Modifica">${icon('settings')}</button></div>`).join(''):empty('checklist','Nessuna attività','Modifica i filtri oppure crea una nuova attività.')}</div>`}
function attendance(){const todays=data.attendance.filter(a=>localDate(a.start)===localDate()).sort((a,b)=>b.start.localeCompare(a.start));let my=activeAttendance(currentStaffId);const staff=data.staff.filter(x=>x.active);const thisMonth=localDate().slice(0,7);const myMonth=data.attendance.filter(x=>x.staffId===currentStaffId&&localDate(x.start).startsWith(thisMonth));return `${pageHeader('Presenze e turni','Entrate, uscite e pause con orari registrati automaticamente.',btn(`${icon('download')} Esporta CSV`,'export-attendance','secondary'))}<div class="feature-row"><div class="card card-pad"><div class="eyebrow">Timbratura rapida</div><h2>${esc(name('staff',currentStaffId))}</h2><p class="subtitle">Gli orari usano la data e l’ora del dispositivo.</p><div style="margin-top:24px">${my?`<div class="work-active"><div><div class="small">${isPaused(my)?'Pausa in corso':'Turno in corso'}</div><div class="time">Entrata ${fmtTime(my.start)}</div></div>${badge(isPaused(my)?'amber':'','Attivo')}</div><div class="row-actions">${isPaused(my)?btn(`${icon('play')} Riprendi`,'resume','secondary'):btn(`${icon('pause')} Inizia pausa`,'pause','secondary')}${btn(`${icon('stop')} Termina turno`,'clock-out','primary')}</div>`:`<div class="notice">${icon('info')}Non hai un turno aperto. Premi qui sotto per registrare l’entrata.</div><div style="margin-top:18px">${btn(`${icon('play')} Inizia turno`,'clock-in','primary')}</div>`}</div></div><div class="card card-pad"><div class="eyebrow">Le tue ore questo mese</div><div class="stat-value" style="font-size:41px;margin-top:10px">${durationText(sum(myMonth,durationMs))}</div><p class="subtitle">${myMonth.length} turni registrati · pause escluse</p><div class="line-break" style="margin:24px 0"></div><h3>Come funziona</h3><p class="subtitle">Una persona può avere un solo turno aperto. Le pause sono tracciate e sottratte dalle ore effettive. Le modifiche amministrative richiederanno un registro delle correzioni nella versione con server.</p></div></div><div class="card"><div class="card-head"><h2>Turni di oggi</h2>${badge('grey',`${staff.length} membri`)}</div><div class="table-wrap"><table class="table"><thead><tr><th>Dipendente</th><th>Entrata</th><th>Uscita</th><th>Pause</th><th class="num">Ore effettive</th></tr></thead><tbody>${todays.length?todays.map(a=>`<tr><td><strong>${esc(name('staff',a.staffId))}</strong></td><td>${fmtTime(a.start)}</td><td>${a.end?fmtTime(a.end):badge('','In corso')}</td><td>${a.breaks.length}</td><td class="num">${durationText(durationMs(a))}</td></tr>`).join(''):`<tr><td colspan="5">${empty('clock','Nessun turno registrato','Le presenze compaiono qui dopo la timbratura.')}</td></tr>`}</tbody></table></div></div>`}

function materials(){return `${pageHeader('Materiali e consumi','Prezzi di riferimento e materiali associati agli interventi.',`${btn(`${icon('plus')} Nuovo prodotto`,'open:product','primary')} ${btn('Registra utilizzo','open:usage','secondary')}`)}<div class="notice" style="margin-bottom:20px">${icon('info')}Il catalogo conserva il prezzo predefinito. Ogni materiale utilizzato riceve una copia del prezzo al momento della registrazione: modificare il catalogo non altera i vecchi rapporti o le fatture.</div><div class="card"><div class="card-head"><h2>Catalogo prodotti</h2>${badge('grey',`${data.products.length} prodotti`)}</div><div class="table-wrap"><table class="table"><thead><tr><th>Materiale</th><th>Unità</th><th>Prezzo unitario</th><th>Modalità</th><th>IVA</th><th></th></tr></thead><tbody>${data.products.length?data.products.map(p=>`<tr><td class="desc">${esc(p.name)}</td><td>${esc(p.unit)}</td><td>${euro(p.price)}</td><td>${badge('grey',p.priceMode==='gross'?'IVA inclusa':'IVA esclusa')}</td><td>${p.vat}%</td><td>${btn('Modifica','open:product','secondary',`data-id="${p.id}"`)}</td></tr>`).join(''):`<tr><td colspan="6">${empty('package','Catalogo vuoto','Aggiungi il primo prodotto.')}</td></tr>`}</tbody></table></div></div><div class="card" style="margin-top:19px"><div class="card-head"><h2>Ultimi materiali utilizzati</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Materiale</th><th>Cliente / Rapporto</th><th>Quantità</th><th>Importo lordo</th><th>Fatturazione</th></tr></thead><tbody>${data.reportMaterials.length?[...data.reportMaterials].reverse().slice(0,15).map(m=>{const r=reportForMaterial(m);return `<tr><td class="desc">${esc(m.description)}</td><td>${esc(name('clients',r?.clientId))}<div class="fine">${fmtDate(r?.date)}</div></td><td>${esc(m.qty)} ${esc(m.unit)}</td><td>${euro(priceParts(m).gross)}</td><td>${badge(m.invoiceId?'blue':m.billable?'amber':'grey',m.invoiceId?'In bozza fattura':m.billable?'Da fatturare':'Non addebitare')}</td></tr>`}).join(''):`<tr><td colspan="5">${empty('package','Nessun consumo','Registra i materiali usati in un rapporto.')}</td></tr>`}</tbody></table></div></div>`}
function invoices(){let drafts=[...data.invoices].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return `${pageHeader('Fatturazione','Bozze preparate dai rapporti approvati, pronte per il controllo finale.',btn(`${icon('plus')} Crea fattura`,'open:invoice','primary'))}<div class="notice warning" style="margin-bottom:20px">${icon('alert')}Questa versione prepara bozze e stampe PDF di cortesia. Non genera un XML FatturaPA validato e non invia nulla allo SdI: una bozza non equivale a fattura fiscalmente emessa.</div><div class="stat-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${stat('Bozze preparate',drafts.length,'Non emesse allo SdI','receipt')}${stat('Totale bozze',euro(sum(drafts,i=>invoiceTotal(i.lines).gross)),'Totale lordo indicativo','file')}${stat('Voci pronte',data.reportMaterials.filter(m=>!m.invoiceId&&m.billable&&reportForMaterial(m)?.status==='approved').length,'Approvate e non incluse','package')}</div><div class="card"><div class="card-head"><h2>Elenco bozze</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>N° bozza</th><th>Cliente</th><th>Data</th><th>Voci</th><th class="num">Importo</th><th>Azioni</th></tr></thead><tbody>${drafts.length?drafts.map(i=>`<tr><td class="desc">${esc(i.number)}</td><td>${esc(i.clientSnapshot.name)}</td><td>${fmtDate(i.date)}</td><td>${i.lines.length}</td><td class="num"><strong>${euro(invoiceTotal(i.lines).gross)}</strong></td><td><div class="row-actions">${btn(`${icon('eye')} Visualizza`,'view-invoice','secondary',`data-id="${i.id}"`)}${btn(icon('trash'),'delete-invoice','danger',`data-id="${i.id}" title="Elimina bozza"`)}</div></td></tr>`).join(''):`<tr><td colspan="6">${empty('receipt','Nessuna bozza','Approva un rapporto e crea una bozza fattura per il cliente.')}</td></tr>`}</tbody></table></div></div>`}
function clients(){return `${pageHeader('Rubrica clienti','Dati anagrafici e fiscali salvati una volta, riutilizzati nei rapporti e nelle bozze.',`${btn(`${icon('plus')} Nuovo cliente`,'open:client','primary')} ${btn('Nuovo cantiere','open:site','secondary')}`)}<div class="three-col">${data.clients.map(c=>`<div class="card card-pad"><div class="job-top"><div class="icon-box">${icon('building')}</div>${badge('grey',c.type==='azienda'?'Azienda':'Privato')}</div><h2 style="margin-top:16px">${esc(c.name)}</h2><p class="subtitle">${esc([c.street,c.city].filter(Boolean).join(', ')||'Indirizzo non registrato')}</p><div class="line-break" style="margin:18px 0"></div><div class="day-row"><span class="small muted">Cantieri</span><strong>${data.sites.filter(s=>s.clientId===c.id).length}</strong></div><div class="day-row"><span class="small muted">Rapporti</span><strong>${data.reports.filter(r=>r.clientId===c.id).length}</strong></div><div style="margin-top:17px">${btn('Apri anagrafica','open:client','secondary',`data-id="${c.id}"`)}</div></div>`).join('')||`<div class="card full">${empty('users','Nessun cliente','Aggiungi un cliente per iniziare.')}</div>`}</div><div class="card" style="margin-top:22px"><div class="card-head"><h2>Cantieri / luoghi di intervento</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Cantiere</th><th>Cliente</th><th>Indirizzo</th></tr></thead><tbody>${data.sites.map(s=>`<tr><td class="desc">${esc(s.name)}</td><td>${esc(name('clients',s.clientId))}</td><td>${esc(s.address)}</td></tr>`).join('')||'<tr><td colspan="3">Nessun cantiere</td></tr>'}</tbody></table></div></div>`}
function settings(){const c=data.company;return `${pageHeader('Azienda e personale','Informazioni del titolare, dati di fatturazione e gestione della squadra.',btn(`${icon('settings')} Modifica azienda`,'open:company','primary'))}<div class="two-col"><div class="card card-pad"><div class="eyebrow">Dati emittente</div><h2>${esc(c.name||'Azienda da configurare')}</h2><p class="subtitle">I dati inseriti qui si riportano nelle nuove bozze fattura.</p><dl class="kv" style="margin-top:22px"><dt>Partita IVA</dt><dd>${esc(c.vat||'Da inserire')}</dd><dt>Codice fiscale</dt><dd>${esc(c.fiscalCode||'Da inserire')}</dd><dt>Indirizzo</dt><dd>${esc([c.street,c.zip,c.city,c.province].filter(Boolean).join(', ')||'Da inserire')}</dd><dt>PEC</dt><dd>${esc(c.pec||'Da inserire')}</dd><dt>Regime fiscale</dt><dd>${esc(c.taxRegime||'Da verificare')}</dd><dt>IBAN</dt><dd>${esc(c.iban||'Da inserire')}</dd></dl></div><div class="card card-pad"><div class="eyebrow">Gestione staff</div><div class="job-top"><h2>La tua squadra</h2>${btn(`${icon('plus')} Aggiungi`,'open:staff','secondary')}</div><div class="day-list" style="margin-top:18px">${data.staff.map(s=>`<div class="day-row"><div><strong>${esc(s.name)}</strong><div class="small muted">${s.role==='titolare'?'Titolare / amministratore':'Operatore'} · ${s.active?'Attivo':'Disattivato'}</div></div>${btn('Modifica','open:staff','secondary',`data-id="${s.id}"`)}</div>`).join('')}</div></div></div><div class="two-col" style="margin-top:19px"><div class="card card-pad"><h2>Backup dimostrativo</h2><p class="subtitle">Esporta tutti i dati locali in un file JSON. Questa funzione non è un backup cloud.</p><div class="row-actions" style="margin-top:17px">${btn(`${icon('download')} Esporta backup`,'backup','secondary')}${btn('Ripristina esempi','reset','danger')}</div></div><div class="card card-pad"><h2>Limiti attuali del prototipo</h2><p class="subtitle">Non sono ancora attivi account reali, sincronizzazione tra telefoni, permessi server, documenti XML fiscali e invio di fatture. Prima dell’uso aziendale servono backend, controllo degli accessi e test.</p></div></div>`}
function dialog(title,subtitle,body,footer='',wide=false){return `<div class="modal-layer" id="modal-layer"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="icon-button" data-action="close" aria-label="Chiudi finestra">${icon('x')}</button></div>${body}${footer}</div></div>`}
const formModal=(id,body,submit='Salva',wide=false)=>`<form id="${id}" style="display:contents"><div class="modal-body">${body}</div><div class="modal-foot">${btn('Annulla','close','secondary')}<button class="button" type="submit">${icon('check')} ${submit}</button></div></form>`;
function renderModal(){let m=modal,x;
switch(m.type){
case 'task':{x=byId('tasks',m.id)||{};return dialog(m.id?'Modifica attività':'Nuova attività','Organizza il lavoro con un responsabile e una scadenza.',formModal('form-task',`<div class="form-grid">${field('Attività *','title','text',x.title,'required maxlength="120"')}${field('Data *','date','date',x.date||localDate(),'required')}${selectField('Cliente *','clientId',options('clients',x.clientId),'required id="form-client"')}${selectField('Cantiere','siteId',siteOptions(x.clientId,x.siteId),'id="form-site"')}${selectField('Assegnata a','staffId',options('staff',x.staffId||currentStaffId))}${selectField('Priorità','priority',['bassa','media','alta'].map(p=>`<option value="${p}" ${x.priority===p?'selected':''}>${p[0].toUpperCase()+p.slice(1)}</option>`).join(''))}${textareaField('Note operative','note',x.note)}</div>`))}
case 'report':{x={};return dialog('Nuovo rapporto giornaliero','Descrivi ciò che è stato fatto. Puoi usare la dettatura vocale.',formModal('form-report',`<div class="form-grid">${field('Data intervento','date','date',localDate(),'required')}${selectField('Operatore','staffId',options('staff',currentStaffId,false),'required')}${selectField('Cliente *','clientId',options('clients'),'required id="form-client"')}${selectField('Cantiere','siteId',siteOptions(),'id="form-site"')}<div class="full"><label class="field"><span>Descrizione dei lavori *</span><textarea class="textarea" id="report-description" name="description" required placeholder="Esempio: taglio del prato, potatura siepi, pulizia delle aiuole..."></textarea></label><div class="row-actions" style="margin-top:10px">${btn(`${icon('mic')} Detta rapporto`,'dictate','secondary','id="dictate-button"')}</div><p class="modal-help" style="margin-top:9px">La disponibilità della dettatura dipende dal browser. In alternativa usa il microfono della tastiera del telefono. Controlla sempre il testo prima di salvarlo.</p></div></div>`,'Salva rapporto'))}
case 'report-detail':{x=byId('reports',m.id);if(!x)return '';const list=data.reportMaterials.filter(z=>z.reportId===x.id);return dialog('Rapporto giornaliero',`${fmtDate(x.date)} · ${name('clients',x.clientId)}`,`<div class="modal-body"><div class="row-actions">${badge(x.status==='approved'?'':'amber',x.status==='approved'?'Verificato dal titolare':'In attesa di verifica')}${badge('grey',name('staff',x.staffId))}</div><div class="card card-pad"><h3>Lavoro eseguito</h3><p style="white-space:pre-wrap;margin-top:9px">${esc(x.description)}</p><p class="subtitle">Cantiere: ${esc(byId('sites',x.siteId)?.name||'Non specificato')}</p></div><div class="job-top"><h3>Materiali impiegati</h3>${btn(`${icon('plus')} Registra materiale`,'open:usage','secondary',`data-id="${x.id}"`)}</div>${list.length?list.map(z=>`<div class="choose-material"><div class="grow"><strong>${esc(z.description)}</strong><div class="small muted">${z.qty} ${esc(z.unit)} · ${euro(priceParts(z).gross)}</div></div>${badge(z.invoiceId?'blue':z.billable?'amber':'grey',z.invoiceId?'In bozza fattura':z.billable?'Da fatturare':'Non addebitare')}</div>`).join(''):empty('package','Nessun materiale associato','Registra eventuali prodotti utilizzati in questo intervento.')}${x.status==='approved'&&list.some(z=>z.billable&&!z.invoiceId)?`<div class="notice">${icon('check')}I materiali da addebitare sono disponibili nella sezione Fatture.</div>`:''}</div><div class="modal-foot">${btn('Chiudi','close','secondary')}${x.status==='draft'&&isOwner()?btn(`${icon('check')} Approva rapporto`,'approve-report','primary',`data-id="${x.id}"`):''}</div>`,true)}
case 'product':{x=byId('products',m.id)||{};return dialog(m.id?'Modifica materiale':'Nuovo materiale','Prezzo di riferimento: può essere IVA inclusa oppure esclusa.',formModal('form-product',`<div class="form-grid">${field('Nome materiale *','name','text',x.name,'required maxlength="120"')}${selectField('Unità di misura','unit',['pezzo','sacco','kg','litro','m²','m³','metro','ora','confezione'].map(v=>`<option value="${v}" ${x.unit===v?'selected':''}>${v}</option>`).join(''))}${field('Prezzo unitario (€) *','price','number',x.price??0,'min="0" step="0.01" required')}${selectField('Il prezzo è','priceMode',`<option value="net" ${x.priceMode!=='gross'?'selected':''}>IVA esclusa</option><option value="gross" ${x.priceMode==='gross'?'selected':''}>IVA inclusa</option>`)}${selectField('Aliquota IVA','vat',[22,10,4,0].map(v=>`<option value="${v}" ${Number(x.vat??22)===v?'selected':''}>${v}%</option>`).join(''))}</div><p class="modal-help">L’aliquota applicabile dipende dal bene, dal servizio e dal regime fiscale dell’azienda. Verificarla prima dell’emissione.</p>`))}
case 'usage':{const reportId=m.id||'',prod=data.products[0];return dialog('Registra materiale utilizzato','La voce verrà associata al rapporto selezionato.',formModal('form-usage',`<div class="form-grid">${selectField('Rapporto *','reportId',`<option value="">Seleziona rapporto...</option>`+data.reports.map(r=>`<option value="${r.id}" ${r.id===reportId?'selected':''}>${fmtDate(r.date)} · ${esc(name('clients',r.clientId))}</option>`).join(''),'required')}${selectField('Materiale *','productId',options('products',prod?.id,false),'required id="usage-product"')}${field('Quantità *','qty','number',1,'min="0.001" step="0.001" required')}${field('Prezzo unitario €','price','number',prod?.price||0,'min="0" step="0.01" required id="usage-price"')}${selectField('Prezzo','priceMode',`<option value="net" ${prod?.priceMode!=='gross'?'selected':''}>IVA esclusa</option><option value="gross" ${prod?.priceMode==='gross'?'selected':''}>IVA inclusa</option>`,'id="usage-mode"')}${selectField('Aliquota IVA','vat',[22,10,4,0].map(v=>`<option value="${v}" ${Number(prod?.vat)===v?'selected':''}>${v}%</option>`).join(''),'id="usage-vat"')}<label class="field full" style="display:flex;flex-direction:row;align-items:center;gap:10px"><input type="checkbox" name="billable" checked style="accent-color:#245c3a;width:19px;height:19px"><span>Addebitare questo materiale al cliente</span></label></div><div class="notice">${icon('info')}Se aggiungi materiali a un rapporto già approvato, il rapporto torna da verificare. Una voce già in bozza fattura non viene modificata.</div>`,'Registra utilizzo'))}
case 'client':{x=byId('clients',m.id)||{};return dialog(m.id?'Modifica anagrafica':'Nuovo cliente','Compila una volta i dati che serviranno per rapporti e fatture.',formModal('form-client-data',`<div class="form-grid">${selectField('Tipo soggetto','type',`<option value="azienda" ${x.type!=='privato'?'selected':''}>Azienda / condominio</option><option value="privato" ${x.type==='privato'?'selected':''}>Persona fisica</option>`)}${field('Ragione sociale o nome *','name','text',x.name,'required')}${field('Partita IVA','vat','text',x.vat,'maxlength="11"')}${field('Codice fiscale','fiscalCode','text',x.fiscalCode,'maxlength="16"')}${field('Indirizzo','street','text',x.street)}${field('CAP','zip','text',x.zip,'maxlength="5"')}${field('Comune','city','text',x.city)}${field('Provincia','province','text',x.province,'maxlength="2"')}${field('Email','email','email',x.email)}${field('Telefono','phone','tel',x.phone)}${field('PEC','pec','email',x.pec)}${field('Codice destinatario SdI','sdi','text',x.sdi,'maxlength="7"')}${textareaField('Note','notes',x.notes)}</div>`,'Salva cliente',true),true)}
case 'site':return dialog('Nuovo cantiere','Un cliente può avere diversi giardini o sedi operative.',formModal('form-site-data',`<div class="form-grid">${selectField('Cliente *','clientId',options('clients'),'required')}${field('Nome cantiere *','name','text','','required')}${field('Indirizzo intervento','address','text','')}</div>`))
case 'staff':{x=byId('staff',m.id)||{};return dialog(m.id?'Modifica membro staff':'Nuovo membro staff','Gestione anagrafica dimostrativa. Gli account personali arriveranno con il backend.',formModal('form-staff',`<div class="form-grid">${field('Nome e cognome *','name','text',x.name,'required')}${selectField('Ruolo','role',`<option value="operatore" ${x.role!=='titolare'?'selected':''}>Operatore</option><option value="titolare" ${x.role==='titolare'?'selected':''}>Titolare / amministratore</option>`)}${selectField('Stato','active',`<option value="true" ${x.active!==false?'selected':''}>Attivo</option><option value="false" ${x.active===false?'selected':''}>Disattivato</option>`)}</div>`))}
case 'company':{x=data.company;return dialog('Dati dell’azienda emittente','Queste informazioni vengono memorizzate e copiate sulle nuove bozze.',formModal('form-company',`<div class="form-grid">${field('Ragione sociale *','name','text',x.name,'required')}${field('Partita IVA','vat','text',x.vat,'maxlength="11"')}${field('Codice fiscale','fiscalCode','text',x.fiscalCode,'maxlength="16"')}${field('Indirizzo','street','text',x.street)}${field('CAP','zip','text',x.zip,'maxlength="5"')}${field('Comune','city','text',x.city)}${field('Provincia','province','text',x.province,'maxlength="2"')}${field('Email','email','email',x.email)}${field('Telefono','phone','tel',x.phone)}${field('PEC','pec','email',x.pec)}${field('Codice destinatario','sdi','text',x.sdi,'maxlength="7"')}${field('IBAN','iban','text',x.iban)}${selectField('Regime fiscale','taxRegime',`<option value="RF01" ${x.taxRegime==='RF01'?'selected':''}>RF01 Ordinario</option><option value="RF19" ${x.taxRegime==='RF19'?'selected':''}>RF19 Forfettario</option><option value="altro" ${x.taxRegime==='altro'?'selected':''}>Altro / verificare</option>`)}${textareaField('Note da riportare in fattura','notes',x.notes)}</div><div class="invoice-legal">I dati fiscali, la natura IVA e il regime devono essere verificati dall’azienda o dal commercialista. Questo prototipo non certifica i documenti.</div>`,'Salva azienda',true),true)}
case 'invoice':{const cId=m.clientId||data.clients[0]?.id||'',billable=pendingMaterials(cId),today=localDate(),year=today.slice(0,4);const seq=String(data.invoices.filter(i=>i.date.startsWith(year)).length+1).padStart(3,'0');return dialog('Nuova bozza fattura','Seleziona il cliente e le voci approvate ancora da fatturare.',formModal('form-invoice',`<div class="form-grid">${selectField('Cliente *','clientId',options('clients',cId,false),'id="invoice-client" required')}${field('Numero di bozza','number','text',`BOZZA-${seq}/${year}`,'required')}${field('Data bozza','date','date',today,'required')}${field('Scadenza pagamento','dueDate','date',localDate(new Date(Date.now()+30*86400000)))}</div><div class="line-break"></div><h3>Materiali approvati disponibili</h3><p class="modal-help">Le voci approvate da rapporti diversi dello stesso cliente si possono unire in un’unica bozza.</p><div id="available-materials">${billable.length?billable.map(z=>`<label class="choose-material"><input type="checkbox" name="materialIds" value="${z.id}" checked><span style="flex:1"><strong>${esc(z.description)}</strong><div class="small muted">${z.qty} ${esc(z.unit)} · ${fmtDate(reportForMaterial(z)?.date)}</div></span><strong>${euro(priceParts(z).gross)}</strong></label>`).join(''):'<div class="notice">Nessun materiale approvato da importare. Puoi comunque aggiungere una prestazione manuale.</div>'}</div><div class="line-break"></div><h3>Prestazione aggiuntiva (facoltativa)</h3><div class="form-grid">${field('Descrizione servizio','manualDescription','text','','placeholder="Es. Manutenzione ordinaria giardino"')}${field('Quantità','manualQty','number',1,'min="0.001" step="0.001"')}${field('Prezzo unitario €','manualPrice','number',0,'min="0" step="0.01"')}${selectField('Prezzo','manualMode','<option value="net">IVA esclusa</option><option value="gross">IVA inclusa</option>')}${selectField('IVA servizio','manualVat',[22,10,4,0].map(v=>`<option value="${v}">${v}%</option>`).join(''))}</div><div class="invoice-legal">Attenzione: un prezzo con IVA 0% richiede una verifica della natura fiscale. Questa demo non gestisce automaticamente bollo, ritenute, split payment o XML SdI.</div>`,'Crea bozza',true),true)}
case 'invoice-detail':{x=byId('invoices',m.id);if(!x)return '';const t=invoiceTotal(x.lines);return dialog(`Bozza ${x.number}`,`${x.clientSnapshot.name} · ${fmtDate(x.date)}`,`<div class="modal-body"><div class="notice warning">${icon('alert')}Documento non inviato e non fiscalmente emesso. Disponibile solo una stampa di cortesia.</div><div class="two-col"><div><h3>Emittente</h3><p class="subtitle">${esc(x.companySnapshot.name)}<br>P.IVA ${esc(x.companySnapshot.vat||'non presente')}</p></div><div><h3>Destinatario</h3><p class="subtitle">${esc(x.clientSnapshot.name)}<br>P.IVA ${esc(x.clientSnapshot.vat||'non presente')}</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Voce</th><th>Qtà</th><th>IVA</th><th class="num">Totale</th></tr></thead><tbody>${x.lines.map(l=>`<tr><td>${esc(l.description)}</td><td>${esc(l.qty)} ${esc(l.unit)}</td><td>${esc(l.vat)}%</td><td class="num">${euro(priceParts(l).gross)}</td></tr>`).join('')}</tbody></table></div><div style="text-align:right;display:grid;gap:7px"><div>Imponibile <strong>${euro(t.net)}</strong></div><div>IVA <strong>${euro(t.vat)}</strong></div><h2>Totale ${euro(t.gross)}</h2></div></div><div class="modal-foot">${btn('Chiudi','close','secondary')}${btn(`${icon('download')} Stampa / salva PDF`,'print-invoice','primary',`data-id="${x.id}"`)}</div>`,true)}
default:return '';
}}
function isOwner(){return byId('staff',currentStaffId)?.role==='titolare'}
function deny(){notify('Operazione riservata al titolare nella simulazione.');return false}
function askOwner(){return isOwner()||deny()}
function close(){modal=null;try{recognition?.stop()}catch{}recognition=null;render()}
function openModal(type,id=''){if(['product','client','staff','company','site','invoice'].includes(type)&&!askOwner())return;if(type==='invoice'&&!data.clients.length){notify('Inserisci almeno un cliente.');return}if(type==='usage'&&!data.reports.length){notify('Crea prima un rapporto giornaliero.');return}if(type==='usage'&&!data.products.length){notify('Aggiungi prima un prodotto al catalogo.');return}modal={type,id};render()}
function toggleTask(id){const t=byId('tasks',id);if(!t)return;t.done=!t.done;t.doneAt=t.done?new Date().toISOString():null;store();render();notify(t.done?'Attività completata.':'Attività riaperta.')}
function clockIn(){if(activeAttendance(currentStaffId)){notify('Hai già un turno aperto.');return}data.attendance.push({id:uid(),staffId:currentStaffId,start:new Date().toISOString(),end:null,breaks:[]});store();render();notify('Entrata registrata.')}
function clockOut(){const a=activeAttendance(currentStaffId);if(!a){notify('Nessun turno aperto.');return}if(isPaused(a)){notify('Termina prima la pausa.');return}a.end=new Date().toISOString();store();render();notify('Uscita registrata.')}
function pauseClock(){const a=activeAttendance(currentStaffId);if(!a||isPaused(a))return;a.breaks.push({start:new Date().toISOString(),end:null});store();render();notify('Pausa iniziata.')}
function resumeClock(){const a=activeAttendance(currentStaffId),p=a?.breaks.find(b=>!b.end);if(!p)return;p.end=new Date().toISOString();store();render();notify('Pausa terminata.')}
function approveReport(id){if(!askOwner())return;const r=byId('reports',id);if(!r)return;r.status='approved';r.approvedAt=new Date().toISOString();r.approvedBy=currentStaffId;store();modal=null;render();notify('Rapporto approvato. I materiali addebitabili sono pronti.')}
function downloadFile(content,mime,filename){const b=new Blob([content],{type:mime});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function exportAttendance(){const cols=['Dipendente','Inizio','Fine','Minuti pausa','Ore effettive','Stato'];const rows=data.attendance.map(a=>[name('staff',a.staffId),a.start,a.end||'',Math.round(sum(a.breaks||[],b=>Math.max(0,(new Date(b.end||Date.now())-new Date(b.start))/60000))),round(durationMs(a)/3600000),a.end?'Chiuso':'Aperto']);const q=s=>'"'+String(s??'').replace(/^[=+@\-\t\r]/,m=>"'"+m).replace(/"/g,'""')+'"';downloadFile('\ufeff'+[cols,...rows].map(x=>x.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8','easygart-presenze-'+localDate()+'.csv')}
function printInvoice(id){const i=byId('invoices',id);if(!i)return;const t=invoiceTotal(i.lines),c=i.companySnapshot,b=i.clientSnapshot;const w=window.open('','_blank');if(!w){notify('Consenti l’apertura delle finestre per stampare.');return}const addr=o=>[o.street,[o.zip,o.city,o.province].filter(Boolean).join(' ')].filter(Boolean).join(', ');w.document.open();w.document.write(`<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Bozza ${esc(i.number)}</title><style>body{font:14px Arial,sans-serif;margin:45px;color:#1c3428}header{display:flex;justify-content:space-between;border-bottom:2px solid #204a36;padding-bottom:25px}h1{font-size:27px;margin:0}h2{font-size:17px}p{line-height:1.6}.muted{color:#66766c}.two{display:flex;gap:40px;margin:32px 0}.two>div{flex:1}table{width:100%;border-collapse:collapse;margin:30px 0}th,td{text-align:left;padding:12px;border-bottom:1px solid #ddd}th{background:#eaf2e3}td:last-child,th:last-child{text-align:right}.totals{margin-left:auto;width:240px;display:grid;gap:9px}.totals div{display:flex;justify-content:space-between}.total{border-top:2px solid #214b37;padding-top:14px;font-size:20px;font-weight:700}footer{position:fixed;bottom:28px;color:#a16a1d;font-size:11px}@media print{body{margin:25px}footer{position:fixed;bottom:15px}}</style></head><body><header><div><h1>${esc(c.name||'Emittente')}</h1><p class="muted">${esc(addr(c))}<br>P.IVA: ${esc(c.vat||'Da completare')}<br>C.F.: ${esc(c.fiscalCode||'Da completare')}</p></div><div style="text-align:right"><h1>BOZZA</h1><p>N° ${esc(i.number)}<br>Data: ${fmtDate(i.date)}<br>Scadenza: ${fmtDate(i.dueDate)}</p></div></header><div class="two"><div><h2>Destinatario</h2><p><b>${esc(b.name)}</b><br>${esc(addr(b))}<br>P.IVA: ${esc(b.vat||'—')}<br>C.F.: ${esc(b.fiscalCode||'—')}<br>SDI: ${esc(b.sdi||'—')}</p></div><div><h2>Pagamento</h2><p>IBAN: ${esc(c.iban||'Da completare')}<br>${esc(c.notes||'')}</p></div></div><table><thead><tr><th>Descrizione</th><th>Q.tà</th><th>Prezzo</th><th>IVA</th><th>Totale</th></tr></thead><tbody>${i.lines.map(l=>`<tr><td>${esc(l.description)}</td><td>${esc(l.qty)} ${esc(l.unit)}</td><td>${euro(l.price)}</td><td>${esc(l.vat)}%</td><td>${euro(priceParts(l).gross)}</td></tr>`).join('')}</tbody></table><div class="totals"><div><span>Imponibile</span><b>${euro(t.net)}</b></div><div><span>IVA</span><b>${euro(t.vat)}</b></div><div class="total"><span>Totale</span><span>${euro(t.gross)}</span></div></div><footer>DOCUMENTO DI CORTESIA · NON FISCALMENTE EMESSO · NON TRASMESSO AL SISTEMA DI INTERSCAMBIO</footer></body></html>`);w.document.close();w.focus();setTimeout(()=>{try{w.print()}catch{}},400)}
function dictate(){const Ctor=window.SpeechRecognition||window.webkitSpeechRecognition;const box=document.getElementById('report-description');if(!box)return;if(!Ctor){notify('Questo browser non supporta la dettatura web. Usa il microfono sulla tastiera del telefono.');box.focus();return}if(recognition){try{recognition.stop()}catch{}recognition=null;return}const r=new Ctor();recognition=r;r.lang='it-IT';r.interimResults=false;r.continuous=true;let captured='';r.onresult=e=>{for(let ix=e.resultIndex;ix<e.results.length;ix++){if(e.results[ix].isFinal)captured+=' '+e.results[ix][0].transcript}if(captured.trim()){box.value=(box.value.trim()+' '+captured.trim()).trim();captured=''}};r.onerror=e=>{notify('Dettatura non disponibile: '+e.error+'. Puoi scrivere il rapporto manualmente.')};r.onend=()=>{recognition=null;const b=document.getElementById('dictate-button');if(b)b.innerText='Detta rapporto'};try{r.start();const b=document.getElementById('dictate-button');if(b)b.innerText='Ferma dettatura';notify('Microfono avviato. Dettatura in italiano.') }catch{recognition=null;notify('Impossibile avviare il microfono.')}}
function serializeForm(form){return Object.fromEntries(new FormData(form).entries())}
function submitForm(form){const id=form.id,v=serializeForm(form);let record=null;
switch(id){
case 'form-task':{if(!v.title.trim()||!v.clientId||!v.date){notify('Compila i campi obbligatori.');return}if(v.siteId&&byId('sites',v.siteId)?.clientId!==v.clientId){notify('Il cantiere non appartiene al cliente selezionato.');return}record=byId('tasks',modal.id);if(record)Object.assign(record,v);else data.tasks.push({id:uid(),...v,done:false,createdAt:new Date().toISOString()});break}
case 'form-report':{if(!v.description.trim()||!v.clientId){notify('Indica cliente e lavoro svolto.');return}if(v.siteId&&byId('sites',v.siteId)?.clientId!==v.clientId){notify('Il cantiere non appartiene al cliente selezionato.');return}data.reports.push({id:uid(),...v,description:v.description.trim(),status:'draft',createdAt:new Date().toISOString()});break}
case 'form-product':{if(!askOwner())return;if(!v.name.trim()||fnum(v.price)<0){notify('Controlla nome e prezzo.');return}v.price=fnum(v.price);v.vat=fnum(v.vat);record=byId('products',modal.id);if(record)Object.assign(record,v);else data.products.push({id:uid(),...v});break}
case 'form-usage':{const r=byId('reports',v.reportId),p=byId('products',v.productId);if(!r||!p||fnum(v.qty)<=0||fnum(v.price)<0){notify('Controlla rapporto, materiale, quantità e prezzo.');return}data.reportMaterials.push({id:uid(),reportId:r.id,productId:p.id,description:p.name,unit:p.unit,qty:fnum(v.qty),price:fnum(v.price),priceMode:v.priceMode,vat:fnum(v.vat),billable:!!form.querySelector('[name="billable"]:checked'),invoiceId:null,createdAt:new Date().toISOString()});r.status='draft';r.approvedAt=null;r.approvedBy=null;break}
case 'form-client-data':{if(!askOwner())return;if(!v.name.trim()){notify('Inserisci il nome del cliente.');return}record=byId('clients',modal.id);if(record)Object.assign(record,v);else data.clients.push({id:uid(),...v});break}
case 'form-site-data':{if(!askOwner())return;if(!v.clientId||!v.name.trim()){notify('Seleziona cliente e nome del cantiere.');return}data.sites.push({id:uid(),...v});break}
case 'form-staff':{if(!askOwner())return;if(!v.name.trim()){notify('Inserisci il nome.');return}v.active=v.active==='true';record=byId('staff',modal.id);if(record)Object.assign(record,v);else data.staff.push({id:uid(),...v});break}
case 'form-company':{if(!askOwner())return;Object.assign(data.company,v);break}
case 'form-invoice':{if(!askOwner())return;const c=byId('clients',v.clientId);if(!c){notify('Scegli un cliente.');return}if(!v.number?.trim()||!v.date||(v.dueDate&&v.dueDate<v.date)){notify('Controlla numero, data e scadenza della bozza.');return}if(data.invoices.some(i=>i.number===v.number.trim())){notify('Il numero di bozza è già utilizzato.');return}const selected=new FormData(form).getAll('materialIds'),lines=[];for(const mid of selected){const material=byId('reportMaterials',mid);if(!material||material.invoiceId||!material.billable||reportForMaterial(material)?.status!=='approved'||reportForMaterial(material)?.clientId!==c.id){notify('Una voce è già stata fatturata o non è più approvata.');return}lines.push({materialId:mid,description:material.description,unit:material.unit,qty:material.qty,price:material.price,priceMode:material.priceMode,vat:material.vat})}if(v.manualDescription.trim()){if(fnum(v.manualQty)<=0||fnum(v.manualPrice)<0){notify('Controlla quantità e prezzo del servizio.');return}lines.push({materialId:null,description:v.manualDescription.trim(),unit:'servizio',qty:fnum(v.manualQty),price:fnum(v.manualPrice),priceMode:v.manualMode,vat:fnum(v.manualVat)})}if(!lines.length){notify('Seleziona almeno un materiale o aggiungi una prestazione.');return}const inv={id:uid(),number:v.number.trim(),date:v.date,dueDate:v.dueDate,clientId:c.id,clientSnapshot:structuredClone(c),companySnapshot:structuredClone(data.company),lines,createdAt:new Date().toISOString(),status:'draft'};data.invoices.push(inv);selected.forEach(mid=>byId('reportMaterials',mid).invoiceId=inv.id);break}
default:return}
store();modal=null;render();notify('Salvataggio completato.')}

function tx(s){if(uiLocale!=='de')return s;const core=String(s).trim();let val=I18N_DE[core];if(!val){for(const [re,fn] of dynamicDE){if(re.test(core)){val=core.replace(re,fn);break}}}if(!val)return s;const first=s.indexOf(core);return s.slice(0,first)+val+s.slice(first+core.length)}
function applyLocaleDom(){document.documentElement.lang=uiLocale==='de'?'de':'it';const root=document.getElementById('app');if(!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){if(node.parentElement?.closest('script,style,.user-content,canvas'))continue;if(!NODE_ORIG.has(node))NODE_ORIG.set(node,node.nodeValue);node.nodeValue=tx(NODE_ORIG.get(node));}root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>{let original=ATTR_ORIG.get(el);if(!original){original={};for(const k of ['placeholder','aria-label','title'])if(el.hasAttribute(k))original[k]=el.getAttribute(k);ATTR_ORIG.set(el,original);}for(const [k,v] of Object.entries(original))el.setAttribute(k,tx(v))});document.title='EasyGart | '+(uiLocale==='de'?t(NAV.find(x=>x[0]===screen)?.[1]||'Übersicht'):NAV.find(x=>x[0]===screen)?.[1]||'Gestionale');}

function yyyyMMddAdd(date,amount,unit){let [y,m,d]=date.split('-').map(Number);const z=new Date(Date.UTC(y,m-1,d,12));if(unit==='days')z.setUTCDate(z.getUTCDate()+amount);else if(unit==='weeks')z.setUTCDate(z.getUTCDate()+7*amount);else{const total=y*12+m-1+amount;const ny=Math.floor(total/12),nm=total%12;const last=new Date(Date.UTC(ny,nm+1,0,12)).getUTCDate();return `${ny}-${String(nm+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`;}return z.toISOString().slice(0,10)}
function occurrences(p){const result=[],today=localDate(),start=yyyyMMddAdd(today,-7,'days'),end=yyyyMMddAdd(today,30,'days');let count=0;for(let n=0;n<5000;n++){const when=yyyyMMddAdd(p.startDate,Number(p.interval||1)*n,p.frequency||'weeks');if(when>end||(p.endDate&&when>p.endDate))break;if(when>=start)result.push(when);if(++count>=5000)break;}return result}
function generateRecurring(){initDataExtensions();let changes=0;for(const p of data.maintenancePlans){if(!p.active)continue;for(const date of occurrences(p)){if(data.tasks.some(x=>x.recurrenceId===p.id&&x.occurrenceDate===date))continue;data.tasks.push({id:uid(),title:p.title,clientId:p.clientId,siteId:p.siteId||'',staffId:p.staffId||'',date,priority:p.priority||'media',done:false,note:p.note||'',createdAt:new Date().toISOString(),recurrenceId:p.id,occurrenceDate:date});changes++;if(changes>150)break}}if(changes)store();return changes}

const text=`<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Entwurf ${esc(i.number)}</title><style>body{font:14px Arial,sans-serif;margin:40px;color:#1c3428}header{display:flex;justify-content:space-between;border-bottom:2px solid #204a36;padding-bottom:20px}h1{font-size:25px;margin:0}h2{font-size:16px}.small{color:#66766c}.two{display:flex;gap:35px;margin:30px 0}.two>div{flex:1}table{width:100%;border-collapse:collapse;margin:25px 0}th,td{text-align:left;padding:12px;border-bottom:1px solid #ddd}th{background:#eaf2e3}td:last-child,th:last-child{text-align:right}.totals{margin-left:auto;width:230px;display:grid;gap:10px}.totals>div{display:flex;justify-content:space-between}.total{border-top:2px solid #214b37;padding-top:12px;font-size:20px;font-weight:700}footer{font-size:10px;color:#a16a1d;margin-top:45px}</style></head><body><header><div><h1>${esc(c.name||'Aussteller')}</h1><p class="small">${esc(addr(c))}<br>USt-IdNr.: ${esc(c.vat||'Noch anzugeben')}<br>Steuernummer: ${esc(c.fiscalCode||'Noch anzugeben')}</p></div><div><h1>ENTWURF</h1><p>Nr. ${esc(i.number)}<br>Datum: ${fmtDate(i.date)}<br>Fällig: ${fmtDate(i.dueDate)}</p></div></header><div class="two"><div><h2>Empfänger</h2><p><b>${esc(b.name)}</b><br>${esc(addr(b))}<br>USt-IdNr.: ${esc(b.vat||'—')}<br>Steuernummer: ${esc(b.fiscalCode||'—')}<br>SdI: ${esc(b.sdi||'—')}</p></div><div><h2>Zahlung</h2><p>IBAN: ${esc(c.iban||'Noch anzugeben')}<br>${esc(c.notes||'')}</p></div></div><table><thead><tr><th>Beschreibung</th><th>Menge</th><th>Einzelpreis</th><th>MwSt.</th><th>Brutto</th></tr></thead><tbody>${i.lines.map(l=>`<tr><td>${esc(l.description)}</td><td>${esc(l.qty)} ${esc(l.unit)}</td><td>${euro(l.price)}</td><td>${esc(l.vat)}%</td><td>${euro(priceParts(l).gross)}</td></tr>`).join('')}</tbody></table><div class="totals"><div><span>Netto</span><b>${euro(total.net)}</b></div><div><span>MwSt.</span><b>${euro(total.vat)}</b></div><div class="total"><span>Gesamt</span><span>${euro(total.gross)}</span></div></div><footer>NUR ZUR ANSICHT · STEUERLICH NICHT AUSGESTELLT · NICHT AN DAS SDI ÜBERMITTELT</footer></body></html>`;
w.document.write(text);w.document.close();w.focus();setTimeout(()=>{try{w.print()}catch{}},400)};
// Il caricamento della seconda lingua è immediato e non modifica i dati inseriti nei moduli.
document.addEventListener('change',e=>{if(e.target.id==='app-locale'){uiLocale=e.target.value==='de'?'de':'it';window.__easygartLocale=uiLocale;try{localStorage.setItem(LOCALE_KEY,uiLocale)}catch{}if(modal){applyLocaleDom()}else render();return;}if(e.target.matches('input[data-photo-kind]')){importPhotos(e.target)}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;
if(a==='toggle-recurring'){const p=byId('maintenancePlans',id);if(!p||!askOwner())return;if(p.active&&!confirm(t('Interrompere la programmazione futura di questo piano? Le attività già generate rimarranno disponibili.')))return;p.active=!p.active;store();render();notify(p.active?'Piano riattivato.':'Piano sospeso.');}
else if(a==='back-report'){modal={type:'report-detail',id};render();}
else if(a==='remove-photo'){const p=byId('reportPhotos',id),r=p&&byId('reports',p.reportId);if(!p||r?.signature||data.reportMaterials.some(m=>m.reportId===r.id&&m.invoiceId)||!confirm(t('Eliminare questa fotografia?')))return;data.reportPhotos=data.reportPhotos.filter(x=>x.id!==id);if(r.status==='approved'){r.status='draft';r.approvedAt=null;r.approvedBy=null;}store();render();notify('Foto eliminata.');}
else if(a==='clear-signature'){const canvas=document.getElementById('signature-canvas');if(!canvas)return;const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);delete canvas.dataset.hasInk;}
else if(a==='print-report'){printReport(id)}
});
render();

  </script>
